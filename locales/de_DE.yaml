meta:
  locale: de_DE
  lang: de
  market: de
  currency: EUR
  usd_rate: 0.92
  prompt_file: prompts/desserts_translate_prompt_de_v1.txt

number_format:
  decimal_sep: ","
  range_sep: "–"

spoons:
  tsp: "TL"
  tbsp: "EL"

units:
  weight:
    g_step: 5
    g_step_min: 25
    kg_from_g: 1000
    kg_step: 0.05
    g_suffix: "g"
    kg_suffix: "kg"
  volume:
    ml_step: 5
    ml_step_below: 100
    use_cl: false
    cl_below_ml: 1000
    l_from_ml: 1000
    ml_suffix: "ml"
    cl_suffix: "cl"
    l_suffix: "l"
  length:
    mm_below_cm: 1
    half_cm_below: 5
    mm_suffix: "mm"
    cm_suffix: "cm"

# Порядок записей значим: используется первое совпадение подстроки в EN-исходнике.
