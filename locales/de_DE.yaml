oven:
  tolerance_f: 12
  convection_offset: 20
  context_regex: "(?i)\\b(?:oven|bak(?:e|ed|ing)|roast(?:ed|ing)?|preheat(?:ed)?|broil(?:ed|ing)?)\\b"
  template: "{c} °C Ober-/Unterhitze ({c_conv} °C Umluft)"
  fallback_template: "{c} °C"
  entries:
    225: { c: 110 }
    250: { c: 120 }
    275: { c: 135 }
    300: { c: 150 }
    325: { c: 160 }
    350: { c: 180 }
    375: { c: 190 }
    400: { c: 200 }
    425: { c: 220 }
    450: { c: 230 }
    475: { c: 240 }
    500: { c: 250 }

containers:
  - "ramekins?"
  - "glass(?:es)?"
  - "mugs?"
  - "jars?"
  - "cups?"

nutrition_headers:
  - "Nährwerte"
  - "Nährwertangaben"
  - "Nutritional values"
  - "Calories\\s*:"
