meta:
  locale: fr_FR
  lang: fr
  market: fr
  currency: EUR
  usd_rate: 0.92
  prompt_file: prompts/desserts_translate_prompt_fr_v4.txt

number_format:
  decimal_sep: ","
  range_sep: "–"

spoons:
  tsp: "c. à c."
  tbsp: "c. à s."

units:
  weight:
    g_step: 5
    g_step_min: 25
    kg_from_g: 1000
    kg_step: 0.05
    g_suffix: "g"
    kg_suffix: "kg"
  volume:
    ml_step: 5
    ml_step_below: 100
    use_cl: true
    cl_below_ml: 1000
    l_from_ml: 1000
    ml_suffix: "ml"
    cl_suffix: "cl"
    l_suffix: "l"
  length:
    mm_below_cm: 1
    half_cm_below: 5
    mm_suffix: "mm"
    cm_suffix: "cm"

# Порядок записей значим: используется первое совпадение подстроки в хвосте ингредиента.
