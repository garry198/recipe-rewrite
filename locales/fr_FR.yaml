    225: { c: 110, th: "3-4" }
    250: { c: 120, th: "4" }
    275: { c: 135, th: "4-5" }
    300: { c: 150, th: "5" }
    325: { c: 160, th: "5-6" }
    350: { c: 180, th: "6" }
